<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>داشبورد سرویس لول وندور</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    :root {
      --bg:#060b18; --surface:#0d1b2e; --card:rgba(13,27,46,.88);
      --b1:rgba(255,255,255,.07); --b2:rgba(255,255,255,.14);
      --t1:#f1f5f9; --t2:#94a3b8; --t3:#475569;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Vazirmatn',Tahoma,sans-serif;background:var(--bg);color:var(--t1);height:100vh;display:flex;flex-direction:column;overflow:hidden}

    /* ── Header ── */
    #header{background:linear-gradient(135deg,#06101f,#0d1b2e);border-bottom:1px solid var(--b2);padding:9px 18px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0;box-shadow:0 2px 20px rgba(0,0,0,.6)}
    .h-left{display:flex;align-items:center;gap:10px}
    .dot{width:8px;height:8px;border-radius:50%;background:#22c55e;box-shadow:0 0 8px #22c55e;animation:pulse 2.2s infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
    #page-title{font-size:14px;font-weight:600}
    .h-right{display:flex;align-items:center;gap:10px}
    #last-update{font-size:11px;color:var(--t3)}
    #refresh-btn{background:rgba(255,255,255,.06);color:var(--t2);border:1px solid var(--b2);border-radius:7px;padding:4px 12px;font-size:11px;font-family:'Vazirmatn',Tahoma,sans-serif;cursor:pointer;transition:.2s}
    #refresh-btn:hover{background:rgba(255,255,255,.12)}

    /* ── Breadcrumb ── */
    #breadcrumb{background:rgba(13,27,46,.7);padding:4px 18px;border-bottom:1px solid var(--b1);flex-shrink:0;display:flex;align-items:center;gap:5px}
    .bc{color:var(--t3);cursor:pointer;font-size:12px;transition:color .15s}
    .bc:hover{color:var(--t2)}
    .bc.cur{color:#22c55e;cursor:default;font-weight:600}
    .bc-sep{color:var(--t3);font-size:11px}

    /* ── Filter bar ── */
    #filter-bar{background:rgba(6,11,24,.92);border-bottom:1px solid var(--b2);padding:5px 14px;flex-shrink:0;display:flex;align-items:center;gap:5px;overflow-x:auto;min-height:38px;position:relative;z-index:300}
    #filter-bar::-webkit-scrollbar{height:3px}
    #filter-bar::-webkit-scrollbar-thumb{background:var(--b2)}
    .fb-label{font-size:10px;color:var(--t3);font-weight:700;white-space:nowrap;letter-spacing:.5px;text-transform:uppercase;flex-shrink:0}
    .fb-sep{width:1px;height:18px;background:var(--b2);flex-shrink:0;margin:0 3px}
    .fb-group{font-size:9px;color:var(--t3);white-space:nowrap;flex-shrink:0}
    #filter-badge{background:rgba(34,197,94,.15);border:1px solid rgba(34,197,94,.3);border-radius:5px;padding:1px 8px;font-size:10px;color:#22c55e;font-weight:600;white-space:nowrap;flex-shrink:0;display:none}
    #filter-reset{background:rgba(239,68,68,.12);color:#f87171;border:1px solid rgba(239,68,68,.25);border-radius:7px;padding:2px 9px;font-size:11px;font-family:'Vazirmatn',Tahoma,sans-serif;cursor:pointer;white-space:nowrap;flex-shrink:0;height:26px;display:none;transition:.2s}
    #filter-reset:hover{background:rgba(239,68,68,.22)}

    /* ── Custom searchable select ── */
    .ss{position:relative;flex-shrink:0}
    .ss-btn{background:rgba(13,27,46,.98);color:var(--t3);border:1px solid var(--b2);border-radius:7px;padding:0 26px 0 8px;font-size:11px;font-family:'Vazirmatn',Tahoma,sans-serif;cursor:pointer;height:26px;min-width:108px;max-width:155px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:26px;position:relative;transition:border-color .15s,color .15s;text-align:right}
    .ss-btn::after{content:'▾';position:absolute;left:7px;top:50%;transform:translateY(-50%);font-size:9px;color:var(--t3);transition:transform .2s}
    .ss-btn.active{border-color:rgba(34,197,94,.5);color:var(--t1)}
    .ss-btn.open::after{transform:translateY(-50%) rotate(180deg)}
    /* Fixed-position popup — appended to body, not inside filter-bar */
    .ss-popup{position:fixed;background:#0d1b2e;border:1px solid var(--b2);border-radius:9px;box-shadow:0 12px 32px rgba(0,0,0,.7);z-index:99999;overflow:hidden;min-width:160px}
    .ss-search{width:100%;padding:7px 10px;background:rgba(6,11,24,.8);color:var(--t1);border:none;border-bottom:1px solid var(--b1);font-size:11px;font-family:'Vazirmatn',Tahoma,sans-serif;outline:none;direction:rtl}
    .ss-search::placeholder{color:var(--t3)}
    .ss-list{max-height:220px;overflow-y:auto}
    .ss-list::-webkit-scrollbar{width:3px}
    .ss-list::-webkit-scrollbar-thumb{background:var(--b2);border-radius:2px}
    .ss-opt{padding:7px 11px;font-size:11px;color:var(--t2);cursor:pointer;transition:background .1s;white-space:nowrap}
    .ss-opt:hover{background:rgba(255,255,255,.06);color:var(--t1)}
    .ss-opt.sel{background:rgba(34,197,94,.12);color:#22c55e;font-weight:600}
    .ss-opt.sel::before{content:'✓ ';font-weight:700}
    .ss-empty{padding:10px 11px;font-size:11px;color:var(--t3);text-align:center}
    .ss-loading-msg{padding:10px 11px;font-size:11px;color:var(--t3);text-align:center;display:flex;align-items:center;justify-content:center;gap:7px}
    /* loading state: pulsing green border on the button */
    .ss-btn.loading{border-color:rgba(34,197,94,.35)!important;animation:ss-pulse 1s ease-in-out infinite}
    @keyframes ss-pulse{0%,100%{border-color:rgba(34,197,94,.15)}50%{border-color:rgba(34,197,94,.55)}}
    .ss-spin{width:10px;height:10px;border:1.5px solid rgba(34,197,94,.3);border-top-color:#22c55e;border-radius:50%;animation:rot .7s linear infinite;flex-shrink:0}

    /* ── KPI ── */
    #kpi-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding:7px 14px;background:var(--surface);border-bottom:1px solid var(--b1);flex-shrink:0}
    .kpi{background:var(--card);border:1px solid var(--b1);border-radius:10px;padding:7px 12px;text-align:center}
    .kv{font-size:17px;font-weight:700;color:#22c55e}
    .kl{font-size:10px;color:var(--t3);margin-top:2px}

    /* ── Layout ── */
    #main{display:flex;flex:1;overflow:hidden}

    /* ── Sidebar ── */
    #sidebar{width:210px;background:rgba(6,11,24,.85);border-right:1px solid var(--b1);overflow-y:auto;flex-shrink:0}
    #sidebar::-webkit-scrollbar{width:3px}
    #sidebar::-webkit-scrollbar-thumb{background:var(--b2);border-radius:2px}
    #sb-title{padding:7px 12px;font-size:10px;font-weight:700;color:var(--t3);border-bottom:1px solid var(--b1);position:sticky;top:0;background:rgba(6,11,24,.95);text-transform:uppercase;letter-spacing:1px}
    .pi{display:flex;align-items:center;padding:5px 10px;border-bottom:1px solid rgba(255,255,255,.04);transition:background .12s;gap:5px}
    .pi:hover,.pi.active{background:rgba(255,255,255,.06)}
    .pi.click{cursor:pointer}
    .pi-rank{font-size:10px;color:var(--t3);width:14px;flex-shrink:0;text-align:center}
    .pi-name{font-size:11px;flex:1;color:var(--t2);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .bb{width:30px;height:3px;background:rgba(255,255,255,.06);border-radius:2px;overflow:hidden;flex-shrink:0}
    .bf{height:100%;border-radius:2px}
    .pi-sl{font-size:11px;font-weight:700;min-width:30px;text-align:left;flex-shrink:0}

    /* ── Map ── */
    #map-wrap{flex:1;position:relative;overflow:hidden}
    #lmap{width:100%;height:100%}

    /* ── Tooltip ── */
    #tip{display:none;position:absolute;background:rgba(6,11,24,.96);border:1px solid var(--b2);border-radius:11px;padding:11px 15px;pointer-events:none;z-index:9999;min-width:195px;font-size:12px;box-shadow:0 8px 28px rgba(0,0,0,.6)}
    .tt{font-size:13px;font-weight:700;color:var(--t1);margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--b1)}
    .tr{display:flex;justify-content:space-between;margin-bottom:4px;color:var(--t3)}
    .tr span:last-child{font-weight:600;color:var(--t2)}
    .th{color:var(--t3);font-size:10px;margin-top:6px;text-align:center;border-top:1px solid var(--b1);padding-top:5px}

    /* ── Legend ── */
    #legend{position:absolute;bottom:28px;left:12px;background:rgba(6,11,24,.9);border:1px solid var(--b1);border-radius:10px;padding:9px 13px;z-index:1000}
    #legend h4{font-size:10px;color:var(--t3);margin-bottom:6px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
    .li{display:flex;align-items:center;gap:7px;margin-bottom:3px;font-size:11px;color:var(--t2)}
    .ld{width:10px;height:10px;border-radius:3px;flex-shrink:0}

    /* ── Overlay ── */
    #overlay{position:absolute;inset:0;background:rgba(6,11,24,.85);display:flex;align-items:center;justify-content:center;z-index:5000;flex-direction:column;gap:12px}
    #overlay .msg{color:var(--t2);font-size:13px}
    .spin{width:32px;height:32px;border:2px solid rgba(34,197,94,.2);border-top-color:#22c55e;border-radius:50%;animation:rot .8s linear infinite}
    @keyframes rot{to{transform:rotate(360deg)}}

    /* ── Leaflet overrides ── */
    .leaflet-control-zoom a{background:rgba(13,27,46,.95)!important;color:var(--t2)!important;border-color:var(--b2)!important;font-family:'Vazirmatn',Tahoma,sans-serif!important}
    .leaflet-control-zoom a:hover{background:rgba(13,27,46,1)!important;color:var(--t1)!important}
    .leaflet-control-attribution{background:rgba(6,11,24,.6)!important;color:var(--t3)!important;font-size:9px!important}
    .leaflet-control-attribution a{color:#475569!important}
    .prov-lbl{background:none;border:none;color:rgba(255,255,255,.95);font-family:'Vazirmatn',Tahoma,sans-serif;font-weight:700;font-size:10px;text-shadow:0 1px 4px rgba(0,0,0,1),0 0 8px rgba(0,0,0,.8);text-align:center;pointer-events:none}
    .leaflet-tooltip.sl-lbl{background:none!important;border:none!important;box-shadow:none!important;color:rgba(255,255,255,.95)!important;font-family:'Vazirmatn',Tahoma,sans-serif!important;font-weight:700!important;font-size:9px!important;padding:0!important;text-shadow:0 1px 3px rgba(0,0,0,.9)!important}
    .leaflet-tooltip.sl-lbl::before{display:none!important}
    .store-dot{border-radius:50%;border:2px solid rgba(255,255,255,.25);box-shadow:0 2px 6px rgba(0,0,0,.5)}
  </style>
</head>
<body>

<div id="header">
  <div class="h-left"><div class="dot"></div><h1 id="page-title">سرویس لول وندور — استان‌های ایران</h1></div>
  <div class="h-right">

  <span class="fb-label">فیلتر</span>

  <span class="fb-group">موقعیت:</span>

<div id="main">

  </div>
  <div id="map-wrap">
    <div id="lmap"></div>
    <div id="tip"></div>
    <div id="legend">
      <h4>سرویس لول</h4>
      <div class="li"><div class="ld" style="background:#16a34a"></div>≥ ۸۵٪ عالی</div>
      <div class="li"><div class="ld" style="background:#65a30d"></div>۷۵–۸۵٪ خوب</div>
      <div class="li"><div class="ld" style="background:#ca8a04"></div>۶۵–۷۵٪ متوسط</div>
      <div class="li"><div class="ld" style="background:#ea580c"></div>۵۵–۶۵٪ ضعیف</div>
      <div class="li"><div class="ld" style="background:#dc2626"></div>&lt; ۵۵٪ بحرانی</div>

    <div id="overlay"><div class="spin"></div><div class="msg">در حال اتصال...</div></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
/* ═══════════════════════════════════════════════════════════
   SearchSelect — custom searchable dropdown (fixed position)
   ═══════════════════════════════════════════════════════════ */
class SearchSelect {
  constructor(containerId, placeholder, onChange) {
    this.el          = document.getElementById(containerId);
    this.placeholder = placeholder;
    this.onChange    = onChange;
    this._values     = new Set();
    this._opts       = [];
    this._popup      = null;
    this._isLoading  = false;

    this._btn = document.createElement('div');
    this._btn.className = 'ss-btn';
    this._btn.textContent = placeholder;
    this._btn.addEventListener('click', e => { e.stopPropagation(); this._toggle(); });
    this.el.appendChild(this._btn);
  }

  getValue() { return [...this._values]; }

  setLoading(on) {
    this._isLoading = on;
    this._btn.classList.toggle('loading', on);
    if (!on && this._popup) this._fillList(this._searchInput?.value || '');
  }

  setOptions(arr) {
    this._opts = arr.map(o =>
      typeof o === 'object' && o !== null ? { v: String(o.v), label: String(o.label) } : { v: String(o), label: String(o) }
    );
    const valid = new Set(this._opts.map(o => o.v));
    this._values = new Set([...this._values].filter(v => valid.has(v)));
    this._updateBtn();
    if (this._popup) this._fillList(this._searchInput?.value || '');
  }

  reset() {
    this._values.clear();
    this._updateBtn();
  }

  _labelFor(v) {
    return this._opts.find(o => o.v === v)?.label || v;
  }

  _updateBtn() {
    const n = this._values.size;
    if (!n) {
      this._btn.textContent = this.placeholder;
      this._btn.classList.remove('active');
    } else if (n === 1) {
      this._btn.textContent = this._labelFor([...this._values][0]);
      this._btn.classList.add('active');
    } else {
      this._btn.textContent = n + ' مورد';
      this._btn.classList.add('active');
    }
  }

  _toggle() {
    if (this._popup) { this._close(); return; }
    this._open();
  }

  _open() {
    document.querySelectorAll('.ss-popup').forEach(p => p.remove());

    const rect = this._btn.getBoundingClientRect();
    const popup = document.createElement('div');
    popup.className = 'ss-popup';

    const spaceBelow = window.innerHeight - rect.bottom - 8;
    const maxH = Math.min(280, spaceBelow > 120 ? spaceBelow : rect.top - 8);
    const popW = Math.max(rect.width, 175);

    let left = rect.left;
    if (left + popW > window.innerWidth - 8) left = rect.right - popW;

    popup.style.cssText =
      `top:${rect.bottom + 4}px;left:${left}px;width:${popW}px;max-height:${maxH}px`;

    const inp = document.createElement('input');
    inp.className     = 'ss-search';
    inp.type          = 'text';
    inp.placeholder   = 'جستجو...';
    inp.autocomplete  = 'off';
    inp.addEventListener('input', () => this._fillList(inp.value));
    popup.appendChild(inp);
    this._searchInput = inp;

    const list = document.createElement('div');
    list.className = 'ss-list';
    popup.appendChild(list);
    this._listEl = list;

    document.body.appendChild(popup);
    this._popup = popup;
    this._btn.classList.add('open');

    if (this._isLoading) {
      list.innerHTML = '<div class="ss-loading-msg"><div class="ss-spin"></div>در حال بارگذاری...</div>';
      inp.disabled = true;
    } else {
      this._fillList('');
    }
    inp.focus();

    setTimeout(() => {
      this._outsideHandler = e => {
        if (!popup.contains(e.target) && e.target !== this._btn) this._close();
      };
      document.addEventListener('click', this._outsideHandler);
    }, 0);
  }

  _close() {
    if (!this._popup) return;
    this._popup.remove();
    this._popup    = null;
    this._listEl   = null;
    this._searchInput = null;
    this._btn.classList.remove('open');
    if (this._outsideHandler) {
      document.removeEventListener('click', this._outsideHandler);
      this._outsideHandler = null;
    }
  }

  _toggleVal(v) {
    if (this._values.has(v)) this._values.delete(v);
    else this._values.add(v);
    this._updateBtn();
    this.onChange();
  }

  _fillList(query) {
    const q = query.trim().toLowerCase();
    const list = this._listEl;
    list.innerHTML = '';

    const matches = this._opts.filter(o =>
      !q || o.label.toLowerCase().includes(q) || o.v.includes(query.trim()) || o.label.includes(query.trim())
    );

    const allDiv = document.createElement('div');
    allDiv.className = 'ss-opt' + (!this._values.size ? ' sel' : '');
    allDiv.textContent = this.placeholder;
    allDiv.addEventListener('click', e => {
      e.stopPropagation();
      this._values.clear();
      this._updateBtn();
      this._close();
      this.onChange();
    });
    list.appendChild(allDiv);

    if (!matches.length && q) {
      const em = document.createElement('div');
      em.className = 'ss-empty';
      em.textContent = 'موردی یافت نشد';
      list.appendChild(em);
      return;
    }

    matches.forEach(o => {
      const d = document.createElement('div');
      d.className = 'ss-opt' + (this._values.has(o.v) ? ' sel' : '');
      d.textContent = o.label;
      d.addEventListener('click', e => {
        e.stopPropagation();
        this._toggleVal(o.v);
        d.classList.toggle('sel', this._values.has(o.v));
      });
      list.appendChild(d);
    });
  }
}

/* ═══════════════════════════════════════════════════════════
   App state & config
   ═══════════════════════════════════════════════════════════ */
const API_BASE   = 'http://localhost:8000/api/service-level';
const REFRESH_MS = 5 * 60 * 1000;
const DEFAULT_YR_FROM = 1399;
const DEFAULT_YR_TO   = 1405;

let currentData  = [];
let currentLevel = 'province';
let selectedPath = { province: null, city: null, district: null };

const SB_LABELS = {
  province:'رتبه‌بندی استان‌ها', city:'رتبه‌بندی شهرها',
  district:'رتبه‌بندی مناطق',   store:'رتبه‌بندی فروشگاه‌ها'
};

const TIP = document.getElementById('tip');
const MW  = document.getElementById('map-wrap');

function clr(sl) {
  if (sl >= 85) return '#16a34a';
  if (sl >= 75) return '#65a30d';
  if (sl >= 65) return '#ca8a04';
  if (sl >= 55) return '#ea580c';
  return '#dc2626';
}

const FA_MONTHS = ['','فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
function fmtMonth(m) { return m + ' — ' + (FA_MONTHS[+m] || ''); }

/* ── Searchable selects ─────────────────────────────────────── */
const SS = {};

function initSelects() {
  const defs = [
    { key:'year',     wrap:'ss-year',     ph:`${DEFAULT_YR_FROM}–${DEFAULT_YR_TO}` },
    { key:'month',    wrap:'ss-month',    ph:'همه ماه‌ها'  },
    { key:'day',      wrap:'ss-day',      ph:'همه روزها'   },
    { key:'province', wrap:'ss-province', ph:'همه استان‌ها' },
    { key:'city',     wrap:'ss-city',     ph:'همه شهرها'  },
    { key:'district', wrap:'ss-district', ph:'همه مناطق'  },
    { key:'ig1',      wrap:'ss-ig1',      ph:'سطح ۱'      },
    { key:'ig2',      wrap:'ss-ig2',      ph:'سطح ۲'      },
    { key:'ig3',      wrap:'ss-ig3',      ph:'سطح ۳'      },
    { key:'ig4',      wrap:'ss-ig4',      ph:'سطح ۴'      },
    { key:'ig5',      wrap:'ss-ig5',      ph:'سطح ۵'      },
    { key:'cd',       wrap:'ss-cd',       ph:'همه دپارتمان‌ها' },
  ];
  defs.forEach(({ key, wrap, ph }) => {
    SS[key] = new SearchSelect(wrap, ph, onFilterChange);
  });
}

function getFilters() {
  return {
    year:     SS.year.getValue(),
    month:    SS.month.getValue(),
    day:      SS.day.getValue(),
    province: SS.province.getValue(),
    city:     SS.city.getValue(),
    district: SS.district.getValue(),
    ig1:      SS.ig1.getValue(),
    ig2:      SS.ig2.getValue(),
    ig3:      SS.ig3.getValue(),
    ig4:      SS.ig4.getValue(),
    ig5:      SS.ig5.getValue(),
    cd:       SS.cd.getValue(),
  };
}

function hasActiveFilters() {
  const f = getFilters();
  return Object.entries(f).some(([k, v]) => {
    if (k === 'year' && (!v || !v.length)) return false;
    return v && v.length > 0;
  });
}

function dateFilterLabel() {
  const f = getFilters();
  const y = f.year || [], m = f.month || [], d = f.day || [];
  if (d.length && m.length && y.length) return y.join('،') + '/' + m.join('،') + '/' + d.join('،');
  if (m.length && y.length)             return y.join('،') + '/' + m.join('،');
  if (y.length === 1)                   return y[0];
  if (y.length > 1)                     return y.length + ' سال';
  return `${DEFAULT_YR_FROM}–${DEFAULT_YR_TO}`;
}

const FILTER_PARAM_KEYS = {
  year: 'year', month: 'month', day: 'day',
  province: 'province', city: 'city', district: 'district',
  ig1: 'ig1', ig2: 'ig2', ig3: 'ig3', ig4: 'ig4', ig5: 'ig5',
  cd: 'commerce_dept',
};

function filtersToParams() {
  const f = getFilters();
  const p = new URLSearchParams();
  for (const [key, apiKey] of Object.entries(FILTER_PARAM_KEYS)) {
    (f[key] || []).forEach(v => p.append(apiKey, v));
  }
  return p;
}

let _filterTimer = null;
async function onFilterChange() {
  updateFilterBadge();
  clearTimeout(_filterTimer);
  _filterTimer = setTimeout(async () => {
    await loadFilterOptions();
    loadData();
  }, 350);
}

function resetFilters() {
  Object.values(SS).forEach(s => s.reset());
  updateFilterBadge();
  loadFilterOptions();
  loadData();
}

function updateFilterBadge() {
  const active = hasActiveFilters();
  document.getElementById('filter-badge').style.display = active ? 'inline-block' : 'none';
  document.getElementById('filter-reset').style.display = active ? 'inline-block' : 'none';
}

async function loadFilterOptions() {
  const fp = filtersToParams();
  // show loading on all dropdowns
  Object.values(SS).forEach(s => s.setLoading(true));
  try {
    const r = await fetch(`http://localhost:8000/api/filter-options?${fp}`);
    if (!r.ok) return;
    const d = await r.json();
    SS.province.setOptions((d.provinces      || []).map(v => ({ v, label: v })));
    SS.city    .setOptions((d.cities         || []).map(v => ({ v, label: v })));
    SS.district.setOptions((d.districts      || []).map(v => ({ v, label: v })));
    SS.ig1     .setOptions((d.ig1            || []).map(v => ({ v, label: v })));
    SS.ig2     .setOptions((d.ig2            || []).map(v => ({ v, label: v })));
    SS.ig3     .setOptions((d.ig3            || []).map(v => ({ v, label: v })));
    SS.ig4     .setOptions((d.ig4            || []).map(v => ({ v, label: v })));
    SS.ig5     .setOptions((d.ig5            || []).map(v => ({ v, label: v })));
    SS.cd      .setOptions((d.commerce_depts || []).map(v => ({ v, label: v })));
    if (d.default_year_from) window._defYrFrom = d.default_year_from;
    if (d.default_year_to)   window._defYrTo   = d.default_year_to;
    SS.year._placeholder = `${window._defYrFrom || DEFAULT_YR_FROM}–${window._defYrTo || DEFAULT_YR_TO}`;
    SS.year.placeholder = SS.year._placeholder;
    SS.year    .setOptions((d.years          || []).map(v => ({ v: String(v), label: String(v) })));
    SS.month   .setOptions((d.months         || []).map(v => ({ v: String(v), label: fmtMonth(v) })));
    SS.day     .setOptions((d.days           || []).map(v => ({ v: String(v), label: String(v) })));
  } catch(e) {
    console.warn('filter-options:', e.message);
  } finally {
    Object.values(SS).forEach(s => s.setLoading(false));
  }
}

}).addTo(map);

let geoLayer = null, bubbleLayer = null;

function clearLayers() {
  if (geoLayer)    { map.removeLayer(geoLayer);   geoLayer    = null; }
  if (bubbleLayer) { map.removeLayer(bubbleLayer); bubbleLayer = null; }
  map.eachLayer(l => { if (l._slLabel) map.removeLayer(l); });
}

/* ── Routing ──────────────────────────────────────────────── */
function buildUrl() {
  const fp = filtersToParams();
  const { province, city, district } = selectedPath;
  if (currentLevel === 'province') return `${API_BASE}?${fp}`;
  if (currentLevel === 'city')     { fp.set('province', province); return `${API_BASE}/cities?${fp}`; }
  if (currentLevel === 'district') { fp.set('province', province); fp.set('city', city); return `${API_BASE}/districts?${fp}`; }
  fp.set('province', province); fp.set('city', city); fp.set('district', district);
  return `${API_BASE}/stores?${fp}`;
}

function drillDown(item) {
  if      (currentLevel==='province') { selectedPath.province=item.name_fa; currentLevel='city'; }
  else if (currentLevel==='city')     { selectedPath.city=item.name_fa;     currentLevel='district'; }
  else if (currentLevel==='district') { selectedPath.district=item.name_fa; currentLevel='store'; }
  else return;
  loadData();
}

function drillUp(to) {
  currentLevel = to;
  if (to==='province') selectedPath={province:null,city:null,district:null};
  else if (to==='city')     { selectedPath.city=null; selectedPath.district=null; }
  else if (to==='district') selectedPath.district=null;
  loadData();
}

/* ── Data ──────────────────────────────────────────────────── */
async function loadData() {
  showOverlay('در حال دریافت داده...');
  try {
    const r = await fetch(buildUrl());
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    currentData = (await r.json()).data;
    renderAll(currentData);
    document.getElementById('last-update').textContent =
      'بروزرسانی: ' + new Date().toLocaleTimeString('fa-IR');
    hideOverlay();
  } catch(e) {
    showOverlay(`خطا: ${e.message}`, true);
  }
}

/* ── Render ─────────────────────────────────────────────────── */
function renderAll(data) {
  const sorted = [...data].sort((a,b) => b.sl_percent-a.sl_percent);
  updateBreadcrumb(); updateTitles();
  renderKPIs(sorted); renderSidebar(sorted); renderMap(data);
}

function updateBreadcrumb() {
  const steps = [{label:'ایران',level:'province'}];
  if (selectedPath.province) steps.push({label:selectedPath.province,level:'city'});
  if (selectedPath.city)     steps.push({label:selectedPath.city,    level:'district'});
  if (selectedPath.district) steps.push({label:selectedPath.district,level:'store'});
  document.getElementById('breadcrumb').innerHTML = steps.map((s,i) => {
    const cur = i===steps.length-1;
    return (i>0?'<span class="bc-sep">›</span>':'')+
      `<span class="bc${cur?' cur':''}" ${cur?'':` onclick="drillUp('${s.level}')"`}>${s.label}</span>`;
  }).join('');
}

function updateTitles() {
  const note = hasActiveFilters() ? ' ★' : '';
  const dt   = ' · ' + dateFilterLabel();
  let t = 'سرویس لول وندور — استان‌های ایران';
  if (currentLevel==='city')     t = `شهرهای ${selectedPath.province}`;
  if (currentLevel==='district') t = `مناطق ${selectedPath.city} — ${selectedPath.province}`;
  if (currentLevel==='store')    t = `فروشگاه‌های ${selectedPath.district} — ${selectedPath.city}`;
  document.getElementById('page-title').textContent = t + dt + note;
  document.getElementById('sb-title').textContent   = SB_LABELS[currentLevel];
}

function renderKPIs(sorted) {
  if (!sorted.length) return;
  const avg = Math.round(sorted.reduce((s,p)=>s+p.sl_percent,0)/sorted.length);
  document.getElementById('k-avg').textContent    = avg+'٪';
  document.getElementById('k-best').textContent   = sorted[0].name_fa+'  '+Math.round(sorted[0].sl_percent)+'٪';
  document.getElementById('k-worst').textContent  = sorted.at(-1).name_fa+'  '+Math.round(sorted.at(-1).sl_percent)+'٪';
  document.getElementById('k-target').textContent = sorted.filter(p=>p.sl_percent>=80).length+' / '+sorted.length;
}

function renderSidebar(sorted) {
  const el  = document.getElementById('rank-list');
  const can = currentLevel!=='store';
  el.innerHTML='';
  sorted.forEach((p,i)=>{
    const sl=Math.round(p.sl_percent),c=clr(sl);
    const d=document.createElement('div');
    d.className='pi'+(can?' click':''); d.id='pi-'+i;
    d.innerHTML=`<span class="pi-rank">${i+1}</span>
      <span class="pi-name" title="${p.name_fa}">${p.name_fa}</span>
      <div class="bb"><div class="bf" style="width:${sl}%;background:${c}"></div></div>
      <span class="pi-sl" style="color:${c}">${sl}٪</span>`;
    if(can) d.onclick=()=>drillDown(p);
    el.appendChild(d);
  });
}

/* ── Map rendering ──────────────────────────────────────────── */
function renderMap(data) {
  clearLayers();
  if (currentLevel==='province') renderProvince(data);
  else renderBubbles(data);
}

function renderProvince(data) {
  const pMap={};
  data.forEach(d=>pMap[d.name_fa]=d);
  const sorted=[...data].sort((a,b)=>b.sl_percent-a.sl_percent);

  geoLayer=L.geoJSON(PROVINCES,{
    style:feat=>{
      const p=pMap[feat.properties.name],sl=p?Math.round(p.sl_percent):null;
      return{fillColor:sl!==null?clr(sl):'#1a2a3a',fillOpacity:sl!==null?.72:.2,color:'rgba(6,11,24,.75)',weight:1.5};
    },
    onEachFeature:(feat,layer)=>{
      const p=pMap[feat.properties.name];
      if(!p) return;
      const rank=sorted.findIndex(s=>s.name_fa===p.name_fa);
      layer.on({
        mouseover:e=>{layer.setStyle({fillOpacity:.92,weight:2,color:'rgba(255,255,255,.2)'});hilite(rank);showTip(e.originalEvent,p);},
        mousemove:e=>moveTip(e.originalEvent),
        mouseout:()=>{geoLayer.resetStyle(layer);hideTip();},
        click:()=>{hideTip();drillDown(p);}
      });
      const coords=feat.geometry.coordinates[0];
      let cx=0,cy=0;
      coords.forEach(([lng,lat])=>{cx+=lng;cy+=lat;});
      const m=L.marker([cy/coords.length,cx/coords.length],{
        icon:L.divIcon({html:`<div class="prov-lbl">${Math.round(p.sl_percent)}٪</div>`,className:'',iconSize:[36,16],iconAnchor:[18,8]}),
        interactive:false,zIndexOffset:200
      });
      m._slLabel=true;
      m.addTo(map);
    }
  }).addTo(map);
  try{map.fitBounds(geoLayer.getBounds(),{padding:[16,16]});}catch(e){}
}

function renderBubbles(data) {
  const sorted=[...data].sort((a,b)=>b.sl_percent-a.sl_percent);
  const canDrill=currentLevel!=='store', isStore=currentLevel==='store';
  const markers=[];

  data.forEach(p=>{
    if(!p.lat||!p.lng||isNaN(p.lat)||isNaN(p.lng)) return;
    const sl=Math.round(p.sl_percent),c=clr(sl);
    const rank=sorted.findIndex(s=>s.name_fa===p.name_fa);
    let marker;

    if(isStore){
      marker=L.marker([p.lat,p.lng],{
        icon:L.divIcon({html:`<div class="store-dot" style="width:13px;height:13px;background:${c}"></div>`,className:'',iconSize:[13,13],iconAnchor:[6,6]}),
        zIndexOffset:100
      });
    } else {
      const r=Math.max(8,5+(sl-40)*.14);
      marker=L.circleMarker([p.lat,p.lng],{radius:r,fillColor:c,fillOpacity:.85,color:'rgba(255,255,255,.2)',weight:1.5});
      marker.bindTooltip(sl+'٪',{permanent:true,direction:'center',className:'sl-lbl',offset:[0,0]});
    }

    marker.on('mouseover',e=>{hilite(rank);showTip(e.originalEvent||e,p);});
    marker.on('mousemove',e=>moveTip(e.originalEvent||e));
    marker.on('mouseout',()=>hideTip());
    if(canDrill) marker.on('click',()=>{hideTip();drillDown(p);});
    markers.push(marker);
  });

  bubbleLayer=L.featureGroup(markers).addTo(map);
  if(markers.length){
    try{
      const maxZ=isStore?16:currentLevel==='district'?11:9;
      map.fitBounds(bubbleLayer.getBounds(),{padding:[50,50],maxZoom:maxZ});
    }catch(e){}
  }
}

/* ── Tooltip ─────────────────────────────────────────────────── */
function showTip(e,p){
  const sl=Math.round(p.sl_percent),c=clr(sl);
  const diff=sl-Math.round(p.target_percent),dc=diff>=0?'#22c55e':'#ef4444';
  TIP.innerHTML=`<div class="tt">${p.name_fa}</div>
    <div class="tr"><span>سرویس لول</span><span style="color:${c};font-size:14px">${sl}٪</span></div>
    <div class="tr"><span>هدف</span><span>${Math.round(p.target_percent)}٪</span></div>
    <div class="tr"><span>انحراف</span><span style="color:${dc}">${diff>=0?'+':''}${diff}٪</span></div>
    <div class="tr"><span>وندور</span><span>${p.vendor_count.toLocaleString()}</span></div>
    <div class="tr"><span>سفارش</span><span>${p.total_orders.toLocaleString()}</span></div>
    ${currentLevel!=='store'?'<div class="th">کلیک برای مشاهده جزئیات</div>':''}`;
  TIP.style.display='block'; moveTip(e);
}
function moveTip(e){
  const r=MW.getBoundingClientRect(),W=MW.clientWidth;
  let tx=e.clientX-r.left+14,ty=e.clientY-r.top-85;
  if(tx+210>W) tx=e.clientX-r.left-215;
  if(ty<0) ty=e.clientY-r.top+14;
  TIP.style.left=tx+'px'; TIP.style.top=ty+'px';
}
function hideTip(){
  TIP.style.display='none';
  document.querySelectorAll('.pi').forEach(el=>el.classList.remove('active'));
}
function hilite(rank){
  document.querySelectorAll('.pi').forEach(el=>el.classList.remove('active'));
  document.getElementById('pi-'+rank)?.classList.add('active');
  document.getElementById('pi-'+rank)?.scrollIntoView({block:'nearest'});
}

/* ── Overlay ─────────────────────────────────────────────────── */
function showOverlay(msg,isErr=false){
  const ov=document.getElementById('overlay');
  ov.innerHTML=isErr
    ?`<div style="color:#ef4444;font-size:13px;text-align:center;padding:0 20px">${msg}</div>`
    :`<div class="spin"></div><div class="msg">${msg}</div>`;
  ov.style.display='flex';
}
function hideOverlay(){document.getElementById('overlay').style.display='none';}

/* ── Init ───────────────────────────────────────────────────── */
map.on('resize',()=>map.invalidateSize());
initSelects();
loadFilterOptions();
loadData();
setInterval(loadData, REFRESH_MS);
</script>
